name: Mantener activo

# Supabase gratuito pausa los proyectos sin actividad durante una semana.
# Cada 3 días se hace una consulta mínima (función ping, no lee datos).
on:
  schedule:
    - cron: '17 14 */3 * *' # 09:17 en Ecuador
  workflow_dispatch:

permissions:
  actions: write # para reactivar los workflows programados (ver README)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL y SUPABASE_ANON_KEY"; exit 1
          fi
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase respondió HTTP $codigo"
          [ "$codigo" = "200" ]

      - name: Evitar que GitHub apague los workflows programados por inactividad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in mantener-activo.yml respaldo-semanal.yml importar-drive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" >/dev/null || true
          done
